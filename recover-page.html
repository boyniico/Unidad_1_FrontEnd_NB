<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña | SportClub</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-recover">
    <header id="main-header" class="p-30px width-100percent bg-gradient-135deg-dim-purple-ocean-blue">
        <a href="#">
            <img id="header-logo" src="images/logo.png" alt="SportClub Logo">
        </a>
    </header>

    <main>
        <form id="changePasswordForm">
            <h1>Cambiar contraseña</h1>

            <div class="label-input">
                <label for="current-password">Contraseña actual</label>
                <input
                    type="password"
                    id="current-password"
                    name="currentPassword"
                    autocomplete="current-password"
                    placeholder="Ingresa tu contraseña actual"
                >
            </div>

            <div class="label-input">
                <label for="new-password">Nueva contraseña</label>
                <input
                    type="password"
                    id="new-password"
                    name="newPassword"
                    autocomplete="new-password"
                    placeholder="Mínimo 8 caracteres"
                >
            </div>

            <div class="label-input">
                <label for="confirm-password">Confirmar nueva contraseña</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirmPassword"
                    autocomplete="new-password"
                    placeholder="Repite la nueva contraseña"
                >
            </div>

            <button type="submit" class="btn-primary">Guardar cambios</button>

            <p id="changePasswordMessage" class="form-message"></p>
        </form>
    </main>

    <footer class="p-30px width-100percent bg-gradient-135deg-dim-purple-ocean-blue">
        <p>Made by Nicolás Bustamante, 2026</p>
    </footer>

    <script src="js/change-password.js"></script>
</body>
</html>
